<!DOCTYPE html>
<html>
<head>
  <title>Test SSE Stream</title>
  <style>
    body {
      font-family: monospace;
      padding: 20px;
      background: #1e1e1e;
      color: #d4d4d4;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
    }
    h1 {
      color: #4ec9b0;
    }
    .section {
      margin: 20px 0;
      padding: 15px;
      background: #252526;
      border-radius: 4px;
    }
    button {
      background: #0e639c;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 4px;
      cursor: pointer;
      margin: 5px;
    }
    button:hover {
      background: #1177bb;
    }
    #output {
      white-space: pre-wrap;
      background: #1e1e1e;
      padding: 15px;
      border-radius: 4px;
      border: 1px solid #3c3c3c;
      max-height: 500px;
      overflow-y: auto;
    }
    .success { color: #4ec9b0; }
    .error { color: #f48771; }
    .info { color: #569cd6; }
  </style>
</head>
<body>
  <div class="container">
    <h1>MCP SSE Stream Tester</h1>
    
    <div class="section">
      <h2>Test SSE Connection</h2>
      <button onclick="testSSE()">Connect to SSE Stream</button>
      <button onclick="clearOutput()">Clear Output</button>
    </div>

    <div class="section">
      <h2>Test MCP Requests</h2>
      <button onclick="testInitialize()">1. Initialize</button>
      <button onclick="testToolsList()">2. List Tools</button>
      <button onclick="testSearchTool()">3. Search Components</button>
    </div>

    <div class="section">
      <h2>Output:</h2>
      <div id="output"></div>
    </div>
  </div>

  <script>
    const output = document.getElementById('output');
    let eventSource = null;

    function log(message, type = 'info') {
      const timestamp = new Date().toLocaleTimeString();
      const className = type;
      output.innerHTML += `<span class="${className}">[${timestamp}] ${message}</span>\n`;
      output.scrollTop = output.scrollHeight;
    }

    function clearOutput() {
      output.innerHTML = '';
    }

    function testSSE() {
      if (eventSource) {
        eventSource.close();
      }

      log('Connecting to SSE stream...', 'info');
      
      eventSource = new EventSource('https://www.gtmlabs.io/api/mcp/sse');
      
      eventSource.onopen = () => {
        log('✓ SSE connection opened', 'success');
      };

      eventSource.addEventListener('message', (e) => {
        log('Received message event:', 'success');
        try {
          const data = JSON.parse(e.data);
          log(JSON.stringify(data, null, 2), 'info');
        } catch (err) {
          log(e.data, 'info');
        }
      });

      eventSource.addEventListener('endpoint', (e) => {
        log('Received endpoint event:', 'success');
        log(e.data, 'info');
      });

      eventSource.onerror = (e) => {
        log('✗ SSE error occurred', 'error');
        log(JSON.stringify(e, null, 2), 'error');
      };
    }

    async function sendMCPRequest(method, params = {}) {
      const request = {
        jsonrpc: '2.0',
        id: Date.now(),
        method,
        params
      };

      log(`Sending ${method} request...`, 'info');
      log(JSON.stringify(request, null, 2), 'info');

      try {
        const response = await fetch('https://www.gtmlabs.io/api/mcp/sse', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify(request)
        });

        const reader = response.body.getReader();
        const decoder = new TextDecoder();

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;

          const chunk = decoder.decode(value);
          const lines = chunk.split('\n');

          for (const line of lines) {
            if (line.startsWith('data: ')) {
              const data = line.substring(6);
              try {
                const json = JSON.parse(data);
                log('✓ Response received:', 'success');
                log(JSON.stringify(json, null, 2), 'info');
              } catch (e) {
                log(data, 'info');
              }
            }
          }
        }
      } catch (error) {
        log('✗ Request failed:', 'error');
        log(error.message, 'error');
      }
    }

    function testInitialize() {
      sendMCPRequest('initialize', {
        protocolVersion: '2024-11-05',
        capabilities: {},
        clientInfo: {
          name: 'test-client',
          version: '1.0.0'
        }
      });
    }

    function testToolsList() {
      sendMCPRequest('tools/list', {});
    }

    function testSearchTool() {
      sendMCPRequest('tools/call', {
        name: 'search_components',
        arguments: { query: 'hero' }
      });
    }
  </script>
</body>
</html>
