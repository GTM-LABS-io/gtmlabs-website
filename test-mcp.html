<!DOCTYPE html>
<html>
<head>
  <title>GTM Labs MCP Tester</title>
  <style>
    body { font-family: monospace; padding: 20px; max-width: 800px; margin: 0 auto; }
    button { padding: 10px 20px; margin: 5px; cursor: pointer; }
    pre { background: #f5f5f5; padding: 15px; border-radius: 5px; overflow-x: auto; }
    .success { color: green; }
    .error { color: red; }
  </style>
</head>
<body>
  <h1>GTM Labs MCP Endpoint Tester</h1>
  
  <div>
    <button onclick="testInitialize()">Test Initialize</button>
    <button onclick="testNotification()">Test Notification</button>
    <button onclick="testResourcesList()">Test Resources List</button>
    <button onclick="testToolsList()">Test Tools List</button>
    <button onclick="testSearchTool()">Test Search Tool</button>
  </div>
  
  <h2>Results:</h2>
  <pre id="output">Click a button to test...</pre>
  
  <script>
    const ENDPOINT = 'https://www.gtmlabs.io/api/mcp/sse';
    
    async function sendRequest(method, params = {}) {
      const output = document.getElementById('output');
      output.textContent = 'Sending request...';
      
      try {
        const response = await fetch(ENDPOINT, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            jsonrpc: '2.0',
            id: Date.now(),
            method,
            params
          })
        });
        
        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let result = '';
        
        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          
          const chunk = decoder.decode(value);
          result += chunk;
        }
        
        // Parse SSE format (data: {...})
        const lines = result.split('\n').filter(l => l.startsWith('data: '));
        const jsonData = lines.map(l => JSON.parse(l.substring(6)));
        
        output.innerHTML = `<span class="success">✓ Success</span>\n\n` + 
                          JSON.stringify(jsonData, null, 2);
      } catch (error) {
        output.innerHTML = `<span class="error">✗ Error</span>\n\n` + error.message;
      }
    }
    
    function testInitialize() {
      sendRequest('initialize', {});
    }
    
    function testNotification() {
      sendRequest('notifications/initialized', {});
    }
    
    function testResourcesList() {
      sendRequest('resources/list', {});
    }
    
    function testToolsList() {
      sendRequest('tools/list', {});
    }
    
    function testSearchTool() {
      sendRequest('tools/call', {
        name: 'search_components',
        arguments: { query: 'hero' }
      });
    }
  </script>
</body>
</html>
